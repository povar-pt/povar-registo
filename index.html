<!doctype html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Inscrição | Povar</title>
<meta name="description" content="Inscrição em sessões e formações da Povar.">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#F5F4F1" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0A0A0E" media="(prefers-color-scheme: dark)">
<link rel="icon" href="logo.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="preload" href="monroe-bold.woff2" as="font" type="font/woff2" crossorigin>
<style>
@font-face { font-family: "Monroe"; src: url("monroe-bold.woff2") format("woff2"); font-weight: 600; font-style: normal; font-display: swap; }
@font-face { font-family: "Monroe"; src: url("monroe-light.woff2") format("woff2"); font-weight: 300; font-style: normal; font-display: swap; }

:root {
  --bg: #F5F4F1;
  --surface: #FFFFFF;
  --surface-2: #F0EFF5;
  --border: rgba(100, 90, 130, 0.10);
  --border-pill: rgba(100, 90, 130, 0.18);
  --border-hover: rgba(100, 90, 130, 0.35);
  --ink: #1A1028;
  --body: #6B6878;
  --muted: #9B9BAA;
  --hint: #C0BDC9;
  --v-500: #7C3AED;
  --v-600: #7C3AED;
  --green: #059669;
  --red: #DC2626;
  --dp-bg: #1A1028;
  --dp-text: rgba(196, 179, 240, 0.55);
  --dp-value: #FFFFFF;
  --dp-border-row: rgba(255, 255, 255, 0.08);
  --focus: rgba(124, 58, 237, 0.40);
  --r-md: 6px;
  --r-lg: 9px;
  --r-pill: 20px;
  --title: "Monroe", "Inter", system-ui, sans-serif;
  --text: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme: light;
}
.logo-escuro { display: none; }

@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0A0A0E;
    --surface: #131318;
    --surface-2: #1C1C28;
    --border: rgba(255, 255, 255, 0.07);
    --border-pill: rgba(255, 255, 255, 0.12);
    --border-hover: rgba(255, 255, 255, 0.25);
    --ink: #E8E6F0;
    --body: #A09CB8;
    --muted: #6B6880;
    --hint: #3D3B52;
    --v-500: #9D7FF5;
    --green: #34D399;
    --red: #F87171;
    --dp-bg: #1C1C28;
    --dp-text: rgba(255, 255, 255, 0.40);
    --dp-value: #E8E6F0;
    --dp-border-row: rgba(255, 255, 255, 0.06);
    color-scheme: dark;
  }
  .logo-claro { display: none; }
  .logo-escuro { display: block; }
}

*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--body);
  font: 300 16px/1.65 var(--text);
  -webkit-font-smoothing: antialiased;
}
::selection { background: rgba(124, 58, 237, 0.18); color: var(--ink); }
a { color: var(--v-500); text-decoration: none; }
a:hover { text-decoration: underline; text-underline-offset: 3px; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }

.nav {
  height: 56px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 24px;
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  box-shadow: 0 1px 0 0 rgba(100, 90, 130, 0.06);
}
.marca { display: flex; align-items: center; gap: 9px; color: var(--ink); font-weight: 500; font-size: 15px; letter-spacing: -0.01em; }
.marca:hover { text-decoration: none; }
.marca img { width: 17px; height: 22px; }
.nav-meta { font-size: 13px; font-weight: 400; color: var(--body); padding: 4px 14px; border-radius: var(--r-pill); border: 1px solid var(--border-pill); }

.wrap { max-width: 1120px; margin: 0 auto; padding: 0 24px; }

.palco {
  display: grid;
  grid-template-columns: minmax(0, 1.1fr) minmax(0, 0.9fr);
  grid-template-areas: "intro cartao" "lista cartao";
  column-gap: 72px;
  align-items: start;
  padding: 96px 0 112px;
}
.intro { grid-area: intro; }
.lista { grid-area: lista; }
.cartao { grid-area: cartao; }

.eyebrow { font-size: 12px; font-weight: 500; letter-spacing: 0.10em; text-transform: uppercase; color: var(--muted); margin: 0 0 22px; }
.eyebrow em { font-style: normal; color: var(--v-500); }

h1, h2 { font-family: var(--title); font-weight: 600; color: var(--ink); letter-spacing: -0.025em; margin: 0; }
h1 { font-size: clamp(40px, 4.4vw, 56px); line-height: 1.04; }
h1 .ln { display: block; overflow: hidden; padding-bottom: 0.06em; }
h1 .ln > span { display: block; }
h2 { font-size: 26px; line-height: 1.15; }

.lead { font-size: 18px; line-height: 1.6; margin: 26px 0 0; max-width: 32em; }

/* Data: o elemento central */
.data {
  margin: 56px 0 0;
  display: grid;
  grid-template-columns: auto 1fr;
  background: var(--dp-bg);
  border-radius: var(--r-lg);
  color: var(--dp-value);
  overflow: hidden;
}
.data-dia { padding: 26px 30px; border-right: 1px solid var(--dp-border-row); display: flex; flex-direction: column; justify-content: space-between; min-width: 148px; }
.data-semana { font-size: 12px; font-weight: 500; letter-spacing: 0.10em; text-transform: uppercase; color: var(--dp-text); }
.data-num { font-family: var(--title); font-weight: 600; font-size: 72px; line-height: 0.9; letter-spacing: -0.03em; margin: 18px 0 6px; font-variant-numeric: tabular-nums; }
.data-mes { font-family: var(--title); font-weight: 300; font-size: 22px; letter-spacing: -0.01em; }
.data-linhas { list-style: none; margin: 0; padding: 14px 28px; }
.data-linhas li { display: flex; justify-content: space-between; gap: 16px; padding: 11px 0; border-bottom: 1px solid var(--dp-border-row); font-size: 15px; }
.data-linhas li:last-child { border-bottom: 0; }
.data-linhas span { color: var(--dp-text); }
.data-linhas b { font-weight: 400; color: var(--dp-value); text-align: right; }

.inclui { list-style: none; margin: 48px 0 0; padding: 0; }
.inclui li { display: grid; grid-template-columns: 40px 1fr; gap: 8px; padding: 15px 0; border-top: 1px solid var(--border); font-size: 16px; color: var(--ink); font-weight: 400; line-height: 1.5; }
.inclui li:last-child { border-bottom: 1px solid var(--border); }
.inclui .num { font-size: 13px; font-weight: 500; color: var(--v-500); padding-top: 2px; }

/* Formulário */
.cartao {
  position: sticky;
  top: 32px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--r-lg);
  padding: 34px;
}
.cartao > p { margin: 10px 0 26px; font-size: 15px; }

.campo { margin-bottom: 16px; }
.campo label, .campo legend { display: block; font-size: 13px; font-weight: 500; color: var(--ink); margin-bottom: 7px; padding: 0; }
.campo label small, .campo legend small { font-weight: 300; color: var(--muted); font-size: 13px; }
fieldset.campo { border: 0; margin: 0 0 16px; padding: 0; min-width: 0; }

input[type="text"], input[type="email"], input[type="tel"], textarea {
  width: 100%;
  font: 300 16px/1.4 var(--text);
  color: var(--ink);
  background: var(--surface);
  border: 1px solid var(--border-pill);
  border-radius: 7px;
  padding: 11px 13px;
  outline: none;
  transition: border-color 0.12s;
}
textarea { resize: vertical; min-height: 84px; }
input::placeholder, textarea::placeholder { color: var(--hint); }
input:hover, textarea:hover { border-color: var(--border-hover); }
input:focus, textarea:focus { border-color: var(--focus); }
[aria-invalid="true"] { border-color: var(--red) !important; }

.opcoes { display: flex; flex-wrap: wrap; gap: 6px; }
.opcoes label { margin: 0; position: relative; }
.opcoes input { position: absolute; opacity: 0; pointer-events: none; }
.opcoes span {
  display: inline-flex;
  align-items: center;
  min-height: 40px;
  padding: 8px 15px;
  border-radius: var(--r-pill);
  border: 1px solid var(--border-pill);
  font-size: 14px;
  font-weight: 400;
  color: var(--body);
  cursor: pointer;
  transition: border-color 0.12s, color 0.12s, background 0.12s;
}
.opcoes span:hover { border-color: var(--border-hover); color: var(--ink); }
.opcoes input:checked + span { background: var(--surface-2); border-color: var(--ink); color: var(--ink); font-weight: 500; }
.opcoes input:focus-visible + span { outline: 2px solid var(--focus); outline-offset: 2px; }
.opcoes[aria-invalid="true"] span { border-color: var(--red); }

.mel { position: absolute; left: -10000px; width: 1px; height: 1px; overflow: hidden; }

.consentimento { display: grid; grid-template-columns: 18px 1fr; gap: 10px; align-items: start; margin: 20px 0 22px; font-size: 13px; line-height: 1.55; cursor: pointer; }
.consentimento input { width: 16px; height: 16px; margin: 2px 0 0; accent-color: var(--v-600); }

.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 100%;
  min-height: 48px;
  font: 500 15px/1 var(--text);
  padding: 15px 22px;
  border-radius: var(--r-pill);
  border: 1px solid var(--v-600);
  background: var(--v-600);
  color: #FFFFFF;
  cursor: pointer;
  transition: background 0.12s, border-color 0.12s, opacity 0.12s, transform 0.12s;
}
.btn:hover { background: #6D28D9; border-color: #6D28D9; }
.btn:active { transform: scale(0.985); }
.btn[disabled] { opacity: 0.6; cursor: progress; }

.erro { display: none; margin: 0 0 14px; font-size: 13px; color: var(--red); }
.erro.ativo { display: block; }

.feito[hidden] { display: none; }
.feito .ok { width: 40px; height: 40px; border-radius: 50%; border: 1px solid var(--border-pill); display: flex; align-items: center; justify-content: center; color: var(--green); margin-bottom: 22px; }
.feito p { margin: 12px 0 0; font-size: 15px; }
.feito .resumo { margin-top: 22px; padding: 14px 16px; border-radius: var(--r-md); background: var(--surface-2); font-size: 14px; color: var(--ink); font-weight: 400; }

.privacidade { margin-top: 18px; font-size: 13px; }
.privacidade summary { cursor: pointer; color: var(--muted); font-weight: 400; }
.privacidade p { margin: 10px 0 0; }

.rodape { border-top: 1px solid var(--border); padding: 24px 0 40px; font-size: 13px; color: var(--muted); display: flex; flex-wrap: wrap; justify-content: space-between; gap: 8px 24px; }
.rodape a { color: var(--body); }

.vazio { max-width: 560px; padding: 120px 0; }
.vazio p { font-size: 17px; margin: 18px 0 0; }

/* Tema claro fixo (público de comércio local): ignora o modo escuro do sistema */
html.claro {
  --bg: #FBFBF8; --surface: #FFFFFF; --surface-2: #F3F1EB;
  --border: rgba(10, 10, 10, 0.08); --border-pill: rgba(10, 10, 10, 0.16); --border-hover: rgba(10, 10, 10, 0.32);
  --ink: #141414; --body: #55534E; --muted: #8A8780; --hint: #BDBAB2;
  --v-500: #7C3AED; --green: #059669; --red: #DC2626; --dp-bg: #141414;
  color-scheme: light;
}
html.claro .logo-claro { display: block; }
html.claro .logo-escuro { display: none; }

/* Modo interesse: formulário em passos, para quem usa pouco o computador */
.heroi { display: flex; flex-direction: column; }
.heroi > div:first-child { display: contents; }
.heroi .lead { max-width: 36em; }
.heroi-foto { order: 2; margin: 40px 0 0; position: relative; width: 100%; }
.heroi-foto > img { display: block; width: 100%; height: auto; aspect-ratio: 16 / 10; object-fit: cover; object-position: 50% 22%; border-radius: 16px; background: var(--surface-2); }
.heroi .factos { order: 3; margin-top: 16px; }
.baloes { list-style: none; margin: 0; padding: 0; position: absolute; inset: 0; pointer-events: none; }
.balao {
  position: absolute; display: flex; align-items: center; gap: 12px; width: 34%;
  padding: 9px 14px 9px 9px; border-radius: 14px;
  background: rgba(255, 255, 255, 0.58); border: 1.5px solid rgba(255, 255, 255, 0.9);
  -webkit-backdrop-filter: blur(14px) saturate(1.1); backdrop-filter: blur(14px) saturate(1.1);
  box-shadow: 0 8px 24px rgba(29, 27, 34, 0.18);
}
.balao.esq { left: 4%; } .balao.dir { right: 4%; }
.balao-icone { flex: 0 0 34px; height: 34px; border-radius: 50%; background: rgba(255, 255, 255, 0.9); color: #7C3AED; display: flex; align-items: center; justify-content: center; }
.balao b { display: block; font-size: 15px; font-weight: 600; color: #141414; line-height: 1.25; }
.balao small { display: block; font-size: 13px; color: #3A3833; line-height: 1.3; }
.simples { max-width: 1040px; padding: 56px 0 104px; }
.simples .lead { font-size: 19px; }
.nav { position: relative; }
.nav-selo { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); height: 42px; width: auto; }
.foto-selo { position: absolute; top: 4%; right: 4%; padding: 12px; border-radius: 16px; background: rgba(255, 255, 255, 0.72); border: 1.5px solid rgba(255, 255, 255, 0.9); -webkit-backdrop-filter: blur(14px) saturate(1.1); backdrop-filter: blur(14px) saturate(1.1); box-shadow: 0 8px 24px rgba(29, 27, 34, 0.18); }
.foto-selo img { display: block; height: 92px; width: auto; }
.fecho-selo { display: flex; flex-direction: column; align-items: center; text-align: center; gap: 14px; padding: 8px 0 48px; }
.fecho-selo img { display: block; height: 112px; width: auto; }
.fecho-selo p { margin: 0; font-size: 14px; line-height: 1.5; color: var(--muted); }
@media (max-width: 560px) {
  .foto-selo { top: 3%; right: 3%; padding: 6px; border-radius: 10px; }
  .foto-selo img { height: 52px; }
  .fecho-selo img { height: 96px; }
}
.parceiros { display: flex; align-items: center; gap: 16px 20px; flex-wrap: wrap; margin: 0 0 40px; padding: 14px 18px; background: var(--surface); border: 1px solid var(--border); border-radius: var(--r-lg); max-width: 640px; }
.parceiros-logos { display: flex; align-items: center; gap: 18px; }
.parceiros-logos:empty { display: none; }
.parceiros img { display: block; height: 56px; width: auto; max-width: 160px; object-fit: contain; }
.parceiros p { margin: 0; flex: 1 1 240px; font-size: 14px; line-height: 1.5; }
.factos { list-style: none; margin: 28px 0 0; padding: 0; display: flex; flex-wrap: wrap; gap: 4px 18px; }
.factos li { display: inline-flex; align-items: center; gap: 6px; font-size: 14px; font-weight: 400; color: var(--muted); }
.factos svg { flex: none; }

.passo { margin-top: 72px; }
.passo-topo { display: grid; grid-template-columns: 44px 1fr; gap: 14px; align-items: start; margin-bottom: 24px; }
.passo-num { width: 44px; height: 44px; border-radius: 50%; background: var(--dp-bg); color: #FFFFFF; font: 600 18px/44px var(--title); text-align: center; }
.passo h2 { padding-top: 6px; }
.passo-ajuda { margin: 6px 0 0; font-size: 16px; }

.temas { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
.tema { position: relative; margin: 0; }
.tema input { position: absolute; opacity: 0; pointer-events: none; }
.tema-caixa {
  display: flex; flex-direction: column; height: 100%;
  background: var(--surface); border: 1px solid var(--border-pill); border-radius: var(--r-lg);
  padding: 12px 12px 16px; cursor: pointer;
  transition: border-color 0.15s, background 0.15s, transform 0.15s;
  -webkit-tap-highlight-color: transparent; user-select: none;
}
.tema-caixa:active { transform: scale(0.98); }
@media (hover: hover) { .tema-caixa:hover { border-color: var(--border-hover); } }
.tema-caixa svg { display: block; width: 100%; height: auto; border-radius: 6px; background: var(--surface-2); color: var(--muted); }
.tema-caixa svg .ac { color: var(--muted); transition: color 0.15s; }
.tema b { display: block; margin-top: 12px; font-size: 16px; font-weight: 500; line-height: 1.3; color: var(--ink); }
.tema small { display: block; margin-top: 4px; font-size: 13px; color: var(--muted); line-height: 1.4; }
.tema .visto { position: absolute; top: 18px; right: 18px; width: 26px; height: 26px; border-radius: 50%; background: var(--v-600); color: #FFFFFF; display: flex; align-items: center; justify-content: center; opacity: 0; transform: scale(0.6); transition: opacity 0.15s, transform 0.2s cubic-bezier(0.2, 0.8, 0.2, 1); }
.tema input:checked + .tema-caixa { border-color: var(--ink); background: var(--surface); box-shadow: inset 0 0 0 1px var(--ink); }
.tema input:checked + .tema-caixa svg .ac { color: var(--v-500); }
.tema input:checked ~ .visto { opacity: 1; transform: scale(1); }
.tema input:focus-visible + .tema-caixa { outline: 2px solid var(--focus); outline-offset: 2px; }
.temas[aria-invalid="true"] .tema-caixa { border-color: var(--red); }

.simples .opcoes { gap: 8px; }
.simples .opcoes span { -webkit-tap-highlight-color: transparent; user-select: none; }
.simples .opcoes span { min-height: 48px; padding: 10px 18px; font-size: 16px; }
.simples .campo label, .simples .campo legend { font-size: 16px; margin-bottom: 8px; }
.simples input[type="text"], .simples input[type="email"], .simples input[type="tel"] { font-size: 18px; padding: 14px 16px; min-height: 54px; }
.simples .dados { display: grid; grid-template-columns: 1fr 1fr; gap: 4px 16px; max-width: 720px; }
.simples .dados .campo { margin-bottom: 18px; }
.simples .largo { grid-column: 1 / -1; }
.simples fieldset.campo { margin-bottom: 30px; }
.simples .fim { max-width: 560px; margin-top: 48px; }
.simples .consentimento { font-size: 15px; grid-template-columns: 24px 1fr; gap: 12px; }
.simples .consentimento input { width: 22px; height: 22px; margin-top: 1px; }
.simples .btn { min-height: 58px; font-size: 17px; }
.simples .erro { font-size: 15px; font-weight: 400; }
.simples .erro.ativo { margin: -6px 0 18px; }
.simples .temas + .erro.ativo, .simples .opcoes + .erro.ativo { margin-top: 12px; }
.simples .feito { max-width: 560px; padding-top: 24px; }
.simples .feito p { font-size: 17px; }
.simples .privacidade { max-width: 560px; }

@media (max-width: 900px) {
  .temas { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .heroi-foto > img { aspect-ratio: 4 / 3; object-position: 50% 25%; }
  .balao { width: 50%; padding: 7px 10px 7px 7px; gap: 8px; }
  .balao b { font-size: 14px; } .balao small { font-size: 12px; }
  .balao-icone { flex-basis: 30px; height: 30px; }
}
@media (max-width: 640px) {
  .heroi-foto { margin-top: 32px; }
  .heroi-foto > img { aspect-ratio: 4 / 5; }
}
@media (max-width: 560px) {
  .simples { padding: 48px 0 72px; }
  .simples .lead { font-size: 17px; }
  .passo { margin-top: 56px; }
  .passo-topo { grid-template-columns: 36px 1fr; gap: 12px; }
  .passo-num { width: 36px; height: 36px; font-size: 16px; line-height: 36px; }
  .passo h2 { font-size: 22px; padding-top: 3px; }
  .temas { gap: 8px; }
  .tema-caixa { padding: 8px 8px 12px; }
  .tema b { font-size: 15px; margin-top: 10px; }
  .tema .visto { top: 12px; right: 12px; }
  .balao { width: 76%; padding: 7px 12px 7px 7px; gap: 8px; }
  .balao-icone { flex-basis: 30px; height: 30px; }
  .simples .dados { grid-template-columns: 1fr; }
}

@media (max-width: 900px) {
  .palco { grid-template-columns: 1fr; grid-template-areas: "intro" "cartao" "lista"; row-gap: 48px; padding: 56px 0 72px; }
  .inclui { margin-top: 0; }
  .cartao { position: static; }
  .data { margin-top: 40px; }
}
@media (max-width: 560px) {
  .nav, .wrap { padding-left: 16px; padding-right: 16px; }
  .nav-meta { display: none; }
  h1 { font-size: 36px; }
  .lead { font-size: 17px; }
  .cartao { padding: 26px 20px; }
  .data { grid-template-columns: 1fr; }
  .data-dia { border-right: 0; border-bottom: 1px solid var(--dp-border-row); flex-direction: row; justify-content: flex-start; align-items: baseline; flex-wrap: wrap; gap: 4px 12px; padding: 22px 20px; }
  .data-semana { width: 100%; }
  .data-num { font-size: 56px; margin: 8px 0 0; }
  .data-linhas { padding: 8px 20px; }
  .vazio { padding: 72px 0; }
}
</style>
</head>
<body>

<header class="nav">
  <a class="marca" href="https://povar.pt/">
    <img class="logo-claro" src="simbolo.svg" alt="" width="17" height="22">
    <img class="logo-escuro" src="simbolo-white.svg" alt="" width="17" height="22">
    Povar
  </a>
  <span class="nav-meta" id="nav-meta">Inscrição</span>
</header>

<main class="wrap" id="conteudo">
  <section class="vazio">

    function pilulas(nome, lista, tipo) {
      return lista.map(function (o) {
        return '<label><input type="' + (tipo || 'radio') + '" name="' + nome + '" value="' + esc(o) + '"><span>' + esc(o) + '</span></label>';
      }).join('');
    }

    var aberto = ev.estado === 'aberto';

    main.innerHTML =
      '<section class="simples">' +
        (ev.parceiros ? '<div class="parceiros" data-a><div class="parceiros-logos">' +
          ev.parceiros.logos.map(function (l) { return '<img src="' + esc(l.src) + '" alt="' + esc(l.alt) + '" onerror="this.remove()">'; }).join('') +
          '</div><p>' + esc(ev.parceiros.texto) + '</p></div>' : '') +
        '<div class="heroi"><div>' +
        '<p class="eyebrow" data-a>' + ev.eyebrow + '</p>' +
        '<h1>' + ev.titulo.map(function (l) { return '<span class="ln"><span>' + esc(l) + '</span></span>'; }).join('') + '</h1>' +
        '<p class="lead" data-a>' + esc(ev.lead) + '</p>' +
        '<ul class="factos" data-a>' + (ev.tempo ? '<li class="tempo"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>' + esc(ev.tempo) + '</li>' : '') + ev.factos.map(function (f) { return '<li>' + esc(f) + '</li>'; }).join('') + '</ul>' +
        '</div>' +
        (ev.foto ? '<figure class="heroi-foto"><img src="' + esc(ev.foto.src) + '" alt="' + esc(ev.foto.alt) + '" srcset="' + esc(ev.foto.src.replace('.jpg', '-640.jpg')) + ' 640w, ' + esc(ev.foto.src) + ' 1000w, ' + esc(ev.foto.src.replace('.jpg', '-1200.jpg')) + ' 1200w" sizes="(max-width: 1100px) 92vw, 1040px" width="1000" height="1250">' +
          (ev.foto.baloes ? '<ul class="baloes" aria-hidden="true">' + ev.foto.baloes.map(function (b) {
            return '<li class="balao ' + b.lado + '" style="top:' + b.topo + '%"><span class="balao-icone"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">' + ICONES[b.icone] + '</svg></span><span><b>' + esc(b.t) + '</b><small>' + esc(b.d) + '</small></span></li>';
          }).join('') + '</ul>' : '') +
          (ev.selo ? '<span class="foto-selo"><img src="' + esc(ev.selo.destaque) + '" alt="" onerror="this.parentNode.remove()"></span>' : '') +
          '</figure>' : '') +
        '</div>' +
        (!aberto ? '<div class="passo"><h2>Inscrições fechadas</h2><p class="passo-ajuda">Para saber das próximas turmas, escreva para <a href="mailto:hello@povar.pt">hello@povar.pt</a>.</p></div>' :
        '<div id="bloco-form"><form id="form" novalidate>' +
          '<div class="passo" data-passo>' +
            '<div class="passo-topo"><span class="passo-num">1</span><div><h2>O que quer aprender?</h2><p class="passo-ajuda">Toque nas imagens. Pode escolher várias, ou nenhuma.</p></div></div>' +
            '<div class="temas" id="q-temas" role="group" aria-label="O que quer aprender">' + temas + '</div>' +
            '<div class="opcoes" style="margin-top:14px"><label><input type="checkbox" name="temas" value="nao-sei"><span>Ainda não sei, quero ver o que existe</span></label></div>' +
          '</div>' +
          '<div class="passo" data-passo>' +
            '<div class="passo-topo"><span class="passo-num">2</span><div><h2>Sobre si e a sua loja</h2><p class="passo-ajuda">Só para o podermos contactar.</p></div></div>' +
            '<div class="dados">' +
              '<div class="campo largo"><label for="nome">O seu nome</label><input type="text" id="nome" autocomplete="name" maxlength="80"></div>' +
              '<div class="campo"><label for="telefone">Telemóvel</label><input type="tel" id="telefone" autocomplete="tel" inputmode="tel" maxlength="20" placeholder="912 345 678"></div>' +
              '<div class="campo"><label for="email">Email <small>(se tiver)</small></label><input type="email" id="email" autocomplete="email" inputmode="email" maxlength="120"></div>' +
              '<div class="campo largo"><label for="negocio">Nome da loja ou negócio</label><input type="text" id="negocio" autocomplete="organization" maxlength="100"></div>' +
            '</div>' +
            '<fieldset class="campo"><legend>Que tipo de negócio tem?</legend><div class="opcoes" id="q-ramo">' +
              pilulas('ramo', ['Roupa e calçado', 'Café ou restaurante', 'Mercearia ou alimentação', 'Cabeleireiro ou estética', 'Casa e decoração', 'Serviços', 'Outro']) +
            '</div></fieldset>' +
            '<fieldset class="campo"><legend>Como se dá com o computador e o telemóvel?</legend><div class="opcoes" id="q-nivel">' +
              pilulas('nivel', ['Uso pouco', 'Desenrasco-me', 'Uso todos os dias']) +
            '</div></fieldset>' +
          '</div>' +
          '<div class="passo" data-passo>' +
            '<div class="passo-topo"><span class="passo-num">3</span><div><h2>Quando lhe dá mais jeito?</h2><p class="passo-ajuda">Pode escolher mais do que uma opção.</p></div></div>' +
            '<div class="opcoes" id="q-horario">' +
              pilulas('horario', ['Ao fim do dia, depois de fechar', 'Sábado', 'Segunda-feira à tarde', 'De manhã', 'Tanto faz'], 'checkbox') +
            '</div>' +
            '<div class="fim">' +
              '<div class="mel" aria-hidden="true"><label for="website">Website</label><input type="text" id="website" tabindex="-1" autocomplete="off"></div>' +
              '<label class="consentimento"><input type="checkbox" id="consentimento"><span>Aceito que a Povar e o Bairro Comercial Digital guardem estes dados para organizar a formação e me contactarem sobre ela.</span></label>' +
              '<p class="erro" id="erro" role="alert"></p>' +
              '<button class="btn" type="submit" id="enviar">' + esc(ev.botao) + '</button>' +
            '</div>' +
          '</div>' +
        '</form></div>' +
        '<div class="feito" id="feito" hidden tabindex="-1">' +
          '<div class="ok" aria-hidden="true"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></div>' +
          '<h2>Inscrição feita</h2><p>' + esc(ev.sucesso) + '</p>' +
        '</div>') +
        '<details class="privacidade"><summary>Privacidade</summary><p>Os dados ficam guardados pela Povar, de Davide Calheiros, e são partilhados apenas com a equipa do Bairro Comercial Digital da Câmara Municipal de Viana do Castelo para organizar a formação. Não são vendidos nem usados para outros fins. Pode pedir para os ver ou apagar em <a href="mailto:hello@povar.pt">hello@povar.pt</a>. Esta página não usa cookies.</p></details>' +
      '</section>';

    if (aberto) ligar();
    entrar();

    function $(id) { return document.getElementById(id); }
    function marcados(nome) {
      return Array.prototype.map.call(document.querySelectorAll('input[name="' + nome + '"]:checked'), function (i) { return i.value; });
    }

    function ligar() {
      var form = $('form'), erro = $('erro'), botao = $('enviar'), textoBotao = botao.textContent, inicio = Date.now();

      function falha(texto, el) {
        erro.textContent = texto;
        erro.classList.add('ativo');
        el.setAttribute('aria-invalid', 'true');
        (el.closest('.campo, .consentimento') || el).after(erro);
        el.scrollIntoView({ behavior: 'smooth', block: 'center' });
        var foco = el.querySelector ? (el.querySelector('input') || el) : el;
        setTimeout(function () { foco.focus({ preventScroll: true }); }, 350);
        return false;
      }

      form.addEventListener('change', function (e) {
        var g = e.target.closest('[aria-invalid]');
        if (g) g.removeAttribute('aria-invalid');
        if (e.target.name === 'temas') {
          var naoSei = form.querySelector('input[value="nao-sei"]');
          if (e.target === naoSei && naoSei.checked) form.querySelectorAll('.tema input:checked').forEach(function (i) { i.checked = false; });
          else if (e.target !== naoSei && e.target.checked) naoSei.checked = false;
          $('q-temas').removeAttribute('aria-invalid');
        }
        if (erro.classList.contains('ativo') && !form.querySelector('[aria-invalid]')) erro.classList.remove('ativo');
      });
      form.addEventListener('input', function (e) { if (e.target.getAttribute('aria-invalid')) e.target.removeAttribute('aria-invalid'); });

      form.addEventListener('submit', function (e) {
        e.preventDefault();
        erro.classList.remove('ativo');

        var temasEscolhidos = marcados('temas');
        var nomes = temasEscolhidos.map(function (id) {
          if (id === 'nao-sei') return 'Ainda não sei';
          for (var i = 0; i < TEMAS.length; i++) if (TEMAS[i].id === id) return TEMAS[i].titulo;
          return id;
        });

        var dados = {
          evento: chave,
          nome: $('nome').value.trim(),
          telefone: $('telefone').value.trim(),
          email: $('email').value.trim(),
          negocio: $('negocio').value.trim(),
          tipo_negocio: (marcados('ramo')[0] || ''),
          temas: nomes.length ? nomes : ['Não escolheu'],
          nivel: (marcados('nivel')[0] || ''),
          horario: marcados('horario'),
          website: $('website').value,
          consentimento: $('consentimento').checked,
          t: Date.now() - inicio
        };

        if (dados.nome.length < 2) return falha('Escreva o seu nome.', $('nome'));
        if (dados.telefone.replace(/\D/g, '').length < 9) return falha('Confirme o telemóvel: precisa de 9 algarismos.', $('telefone'));
        if (dados.email && !/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(dados.email)) return falha('O email parece incompleto. Corrija ou deixe em branco.', $('email'));
        if (dados.negocio.length < 2) return falha('Escreva o nome da loja ou do negócio.', $('negocio'));
        if (!dados.tipo_negocio) return falha('Escolha o tipo de negócio.', $('q-ramo'));
        if (!dados.nivel) return falha('Escolha como se dá com o computador e o telemóvel.', $('q-nivel'));
        if (!dados.horario.length) return falha('Escolha pelo menos um horário, ou "Tanto faz".', $('q-horario'));
        if (!dados.consentimento) return falha('Para concluir, toque na caixa de autorização.', $('consentimento'));

        botao.disabled = true;
        botao.textContent = 'A enviar...';
        var controlo = typeof AbortController === 'function' ? new AbortController() : null;
        var limite = setTimeout(function () { if (controlo) controlo.abort(); }, 10000);

        fetch(WEBHOOK, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain;charset=UTF-8' },
          body: JSON.stringify(dados),
          signal: controlo ? controlo.signal : undefined
        }).then(function (res) {
          clearTimeout(limite);
          if (!res.ok) throw new Error(res.status);
          $('bloco-form').hidden = true;
          $('feito').hidden = false;
          $('feito').scrollIntoView({ behavior: 'smooth', block: 'center' });
          $('feito').focus({ preventScroll: true });
          if (window.gsap && !matchMedia('(prefers-reduced-motion: reduce)').matches) {
            gsap.from($('feito').children, { autoAlpha: 0, y: 16, duration: 0.7, ease: 'expo.out', stagger: 0.07 });
          }
        }).catch(function () {
          clearTimeout(limite);
          botao.disabled = false;
          botao.textContent = textoBotao;
          botao.before(erro);
          erro.innerHTML = 'Não foi possível enviar. Tente de novo dentro de um minuto ou escreva para <a href="mailto:hello@povar.pt">hello@povar.pt</a>.';
          erro.classList.add('ativo');
        });
      });
    }

    function entrar() {
      if (!window.gsap) return;
      gsap.registerPlugin(ScrollTrigger);
      gsap.matchMedia().add('(prefers-reduced-motion: no-preference)', function () {
        gsap.timeline({ defaults: { ease: 'expo.out' } })
          .from('.simples .eyebrow', { autoAlpha: 0, y: 12, duration: 0.7 }, 0.05)
          .from('h1 .ln > span', { yPercent: 115, duration: 1.1, stagger: 0.09 }, 0.12)
          .from('.simples .lead', { autoAlpha: 0, y: 20, duration: 0.9 }, 0.36)
          .from('.factos li', { autoAlpha: 0, y: 10, duration: 0.6, stagger: 0.05 }, 0.5)
          .from('.heroi-foto > img', { autoAlpha: 0, scale: 1.03, duration: 1.1 }, 0.2)
          .from('.foto-selo', { autoAlpha: 0, y: -8, duration: 0.7 }, 0.6)
          .from('.balao', { autoAlpha: 0, y: 14, scale: 0.96, duration: 0.7, stagger: 0.12 }, 0.7);
        // Momento de assinatura: as imagens dos temas assentam uma a uma, pela ordem de leitura.
        if (document.getElementById('q-temas')) {
          gsap.from('.tema', { autoAlpha: 0, y: 24, duration: 0.8, ease: 'expo.out', stagger: 0.06,
            scrollTrigger: { trigger: '#q-temas', start: 'top 90%', once: true } });
        }
      });
    }
  }

  function animar() {
    if (!window.gsap) return;
    gsap.registerPlugin(ScrollTrigger);
    var mm = gsap.matchMedia();
    mm.add({ ok: '(prefers-reduced-motion: no-preference)' }, function () {
      var tl = gsap.timeline({ defaults: { ease: 'expo.out' } });
      tl.from('[data-a]:first-child', { autoAlpha: 0, y: 12, duration: 0.7 }, 0.05)
        .from('h1 .ln > span', { yPercent: 115, duration: 1.1, stagger: 0.09 }, 0.12)
        .from('.lead', { autoAlpha: 0, y: 20, duration: 0.9 }, 0.36)
        .from('#cartao', { autoAlpha: 0, y: 28, duration: 1 }, 0.3);

      // Momento de assinatura: o bloco da data abre como uma janela e o dia assenta no lugar.
      var data = gsap.timeline({ scrollTrigger: { trigger: '#data', start: 'top 92%', once: true }, delay: 0.45 });
      data.fromTo('#data', { clipPath: 'inset(0% 100% 0% 0% round 9px)' }, { clipPath: 'inset(0% 0% 0% 0% round 9px)', duration: 1.1, ease: 'expo.inOut' })
        .from('#data-num', { yPercent: 60, autoAlpha: 0, duration: 0.9, ease: 'expo.out' }, '-=0.45')
        .from('.data-linhas li', { autoAlpha: 0, x: -12, duration: 0.6, ease: 'expo.out', stagger: 0.07 }, '<');

      if (document.getElementById('inclui')) {
        gsap.from('#inclui li', { autoAlpha: 0, y: 16, duration: 0.8, ease: 'expo.out', stagger: 0.07,
          scrollTrigger: { trigger: '#inclui', start: 'top 88%', once: true } });
      }
    });
    if (document.fonts && document.fonts.ready) document.fonts.ready.then(function () { ScrollTrigger.refresh(); });
  }
})();
</script>
</body>
</html>
